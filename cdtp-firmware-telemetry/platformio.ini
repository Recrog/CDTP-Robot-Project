; ÇDTP – Robot tarafı BLE telemetri modülü (Modül D) + simülatör
; Derleme:   pio run -e simulator          (varsayılan)
; Yükleme:   pio run -e simulator -t upload
; Seri port: pio device monitor
[platformio]
default_envs = simulator

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@1.4.3

; Uygulamayı donanımsız geliştirmek için: sahte eğim/batarya, BOOT butonu = şarj
[env:simulator]
build_src_filter = +<sim/>

; Kontrol ekibinin entegrasyonu için örnek iskelet
[env:robot_example]
build_src_filter = +<robot_example/>
